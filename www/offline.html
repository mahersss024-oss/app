<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا يوجد اتصال</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #08111d;
        color: #eaf6ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        padding: 28px 22px;
        text-align: center;
        background: linear-gradient(180deg, rgba(15, 33, 52, 0.94), rgba(8, 17, 29, 0.94));
        border: 1px solid rgba(125, 211, 252, 0.28);
        border-radius: 22px;
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.32);
      }

      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        margin: 0 auto 18px;
        font-size: 30px;
        background: #0ea5e9;
        border-radius: 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 800;
      }

      p {
        margin: 0 0 22px;
        color: #b8c7d9;
        font-size: 15px;
        line-height: 1.8;
      }

      button {
        width: 100%;
        padding: 14px 16px;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        background: #1d64f2;
        border: 0;
        border-radius: 14px;
      }

      .hint {
        margin-top: 14px;
        color: #8aa0b7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">!</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر تحميل سوق حمد الآن. تحقق من الاتصال ثم أعد المحاولة.</p>
      <button type="button" onclick="location.href='https://souqhamad.com/'">إعادة المحاولة</button>
      <div class="hint">سيعود التطبيق عند توفر الاتصال.</div>
    </main>
  </body>
</html>
