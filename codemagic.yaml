workflows:
  android-release:
    name: Souq Hamad Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        - android_signing
      node: v22.11.0
      java: 17
      vars:
        APP_VARIANT: production
        EXPO_PUBLIC_API_URL: https://souqhamad.com
    scripts:
      - name: Install pinned pnpm locally
        script: |
          npm install --prefix "$CM_BUILD_DIR/.tools" --no-save --no-audit --no-fund pnpm@10.32.1
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" --version
      - name: Install dependencies
        script: |
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" install --frozen-lockfile
      - name: Typecheck and lint
        script: |
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" check
      - name: Generate Android project
        script: |
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" exec expo prebuild --platform android --no-install
      - name: Prepare Android signing keystore
        script: |
          set -euo pipefail
          : "${CM_KEYSTORE:?CM_KEYSTORE is missing from the android_signing group}"
          : "${CM_KEYSTORE_PASSWORD:?CM_KEYSTORE_PASSWORD is missing from the android_signing group}"
          : "${CM_KEY_ALIAS:?CM_KEY_ALIAS is missing from the android_signing group}"
          : "${CM_KEY_PASSWORD:?CM_KEY_PASSWORD is missing from the android_signing group}"
          : "${CM_ENV:?Codemagic did not provide CM_ENV}"
          export KEYSTORE_PATH="$CM_BUILD_DIR/souq-hamad-release.keystore"
          node <<'NODE'
          const fs = require("node:fs");
          const encoded = process.env.CM_KEYSTORE.replace(/\s/g, "");
          if (!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)) {
            throw new Error("CM_KEYSTORE is not valid base64");
          }
          const keystore = Buffer.from(encoded, "base64");
          if (!keystore.length || keystore.toString("base64").replace(/=+$/, "") !== encoded.replace(/=+$/, "")) {
            throw new Error("CM_KEYSTORE did not decode to a valid keystore file");
          }
          fs.writeFileSync(process.env.KEYSTORE_PATH, keystore, { mode: 0o600 });
          NODE
          printf 'CM_KEYSTORE_PATH=%s\n' "$KEYSTORE_PATH" >> "$CM_ENV"
      - name: Build signed Android App Bundle
        script: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          cd "$CM_BUILD_DIR/android"
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.mapping.txt
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Souq Hamad iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      node: v22.11.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.souqhamad.app
      vars:
        APP_VARIANT: production
        EXPO_PUBLIC_API_URL: https://souqhamad.com
    scripts:
      - name: Install pinned pnpm locally
        script: |
          npm install --prefix "$CM_BUILD_DIR/.tools" --no-save --no-audit --no-fund pnpm@10.32.1
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" --version
      - name: Install dependencies
        script: |
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" install --frozen-lockfile
      - name: Typecheck and lint
        script: |
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" check
      - name: Generate iOS project
        script: |
          "$CM_BUILD_DIR/.tools/node_modules/.bin/pnpm" exec expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Apply iOS signing profiles
        script: |
          IOS_PROJECT="$(find "$CM_BUILD_DIR/ios" -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          test -n "$IOS_PROJECT"
          xcode-project use-profiles --project "$IOS_PROJECT"
      - name: Build signed iOS IPA
        script: |
          IOS_PROJECT="$(find "$CM_BUILD_DIR/ios" -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          IOS_WORKSPACE="$(find "$CM_BUILD_DIR/ios" -maxdepth 2 -name '*.xcworkspace' -print -quit)"
          IOS_SCHEME_FILE="$(find "$IOS_PROJECT/xcshareddata/xcschemes" -maxdepth 1 -name '*.xcscheme' -print -quit)"
          IOS_SCHEME="$(basename "$IOS_SCHEME_FILE" .xcscheme)"
          test -n "$IOS_WORKSPACE"
          test -n "$IOS_SCHEME"
          xcode-project build-ipa --workspace "$IOS_WORKSPACE" --scheme "$IOS_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
